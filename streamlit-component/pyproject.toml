[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fancy-ui-grid"
version = "0.1.0"
description = "Streamlit component wrapping the Fancy UI Grid React data grid"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["streamlit>=1.30"]

[project.urls]
Repository = "https://github.com/doktorigi/Fancy-UI-Grid"

[tool.setuptools]
packages = ["fancy_ui_grid"]

[tool.setuptools.package-data]
fancy_ui_grid = ["frontend_build/**/*"]
