name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  streamlit-component:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit-component
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            streamlit-component/frontend/package-lock.json
      # Root install too: the shared grid source under src/ resolves its
      # deps (lucide-react, date-fns, ...) from the repo root node_modules.
      - run: npm ci
        working-directory: .
      - run: npm ci
        working-directory: streamlit-component/frontend
      - run: npm run build
        working-directory: streamlit-component/frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python smoke_test.py
